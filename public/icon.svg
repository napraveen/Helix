<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="helixGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="helixGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- DNA / Graph Helix rungs (connecting nodes) -->
  <line x1="20" y1="18" x2="44" y2="18" stroke="#64748b" stroke-width="2" stroke-dasharray="2 2" stroke-opacity="0.7" />
  <line x1="23" y1="27" x2="41" y2="27" stroke="#64748b" stroke-width="2" stroke-opacity="0.8" />
  <line x1="28" y1="36" x2="36" y2="36" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.9" />
  <line x1="23" y1="45" x2="41" y2="45" stroke="#64748b" stroke-width="2" stroke-opacity="0.8" />
  <line x1="20" y1="54" x2="44" y2="54" stroke="#64748b" stroke-width="2" stroke-dasharray="2 2" stroke-opacity="0.7" />

  <!-- Helix strand 1 -->
  <path d="M 20 18 Q 14 36 32 36 Q 50 36 44 54" stroke="url(#helixGrad1)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow)" />
  
  <!-- Helix strand 2 -->
  <path d="M 44 18 Q 50 36 32 36 Q 14 36 20 54" stroke="url(#helixGrad2)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow)" />

  <!-- Glowing Graph Nodes -->
  <circle cx="20" cy="18" r="3.8" fill="#38bdf8" />
  <circle cx="44" cy="18" r="3.8" fill="#a855f7" />
  <circle cx="32" cy="36" r="4.5" fill="#22d3ee" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="20" cy="54" r="3.8" fill="#ec4899" />
  <circle cx="44" cy="54" r="3.8" fill="#818cf8" />
</svg>
