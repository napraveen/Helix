name: HELIX Production CI & Verification Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Full Multi-Stage Verification Pipeline
    runs-on: ubuntu-latest

    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Stage 1 - TypeScript Compilation (Zero Errors)
        run: npm run typecheck

      - name: Stage 2 - ESLint Code Hygiene (Zero Warnings)
        run: npm run lint

      - name: Stage 3 - Seed FalkorDB Graph
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
        run: npm run seed

      - name: Stage 4 - Golden Evaluation Harness
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
          HELIX_ACTIONS_MODE: dryrun
          GITHUB_WRITE_REPO: demo-dev/helix-demo-ops
        run: npm run eval

      - name: Stage 5 - Honest 4-Arm Retrieval Benchmark
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
        run: npm run bench

      - name: Stage 6 - Next.js Production Build
        run: npm run build
